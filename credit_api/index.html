<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Risk Predictor</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #5b6475;
    --border: #d5d9e2; --accent: #2457d6; --accent-text: #ffffff;
    --high-bg: #fde8e8; --high-text: #9b1c1c; --low-bg: #e3f6ea; --low-text: #14663a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1c212c; --text: #e8ebf2; --muted: #a0a8b8;
      --border: #333b4d; --accent: #5b8cff; --accent-text: #0d1220;
      --high-bg: #3b1c1c; --high-text: #ffb4b4; --low-bg: #14301f; --low-text: #9be3b7;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 560px; margin: 0 auto; background: var(--card);
          border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: 0.92rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
  small { display: block; color: var(--muted); font-weight: 400; font-size: 0.75rem; }
  input { width: 100%; padding: 9px 10px; border: 1px solid var(--border);
          border-radius: 8px; background: var(--bg); color: var(--text); font-size: 0.95rem; }
  button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 10px;
           background: var(--accent); color: var(--accent-text); font-size: 1rem;
           font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: wait; }
  #result { margin-top: 20px; padding: 16px; border-radius: 10px; display: none; }
  #result.high { background: var(--high-bg); color: var(--high-text); }
  #result.low { background: var(--low-bg); color: var(--low-text); }
  #result.error { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  #result .big { font-size: 1.5rem; font-weight: 700; }
  .note { margin-top: 18px; font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <h1>Credit Risk Predictor</h1>
  <p class="sub">Enter applicant details to estimate the probability of loan default. Leave a field empty to use the typical value from the training data.</p>

  <form id="form">
    <div class="grid">
      <div>
        <label for="EXT_SOURCE_1">External score 1 <small>0 to 1</small></label>
        <input id="EXT_SOURCE_1" type="number" step="any" min="0" max="1" placeholder="e.g. 0.5">
      </div>
      <div>
        <label for="EXT_SOURCE_2">External score 2 <small>0 to 1</small></label>
        <input id="EXT_SOURCE_2" type="number" step="any" min="0" max="1" placeholder="e.g. 0.6">
      </div>
      <div>
        <label for="EXT_SOURCE_3">External score 3 <small>0 to 1</small></label>
        <input id="EXT_SOURCE_3" type="number" step="any" min="0" max="1" placeholder="e.g. 0.5">
      </div>
      <div>
        <label for="age">Age <small>in years</small></label>
        <input id="age" type="number" step="1" min="18" max="100" placeholder="e.g. 35">
      </div>
      <div>
        <label for="AMT_INCOME_TOTAL">Yearly income</label>
        <input id="AMT_INCOME_TOTAL" type="number" step="any" min="0" placeholder="e.g. 150000">
      </div>
      <div>
        <label for="AMT_CREDIT">Loan amount</label>
        <input id="AMT_CREDIT" type="number" step="any" min="0" placeholder="e.g. 500000">
      </div>
      <div>
        <label for="AMT_GOODS_PRICE">Goods price <small>item the loan is for</small></label>
        <input id="AMT_GOODS_PRICE" type="number" step="any" min="0" placeholder="e.g. 450000">
      </div>
      <div>
        <label for="AMT_ANNUITY">Yearly repayment</label>
        <input id="AMT_ANNUITY" type="number" step="any" min="0" placeholder="e.g. 25000">
      </div>
    </div>
    <button id="btn" type="submit">Predict risk</button>
  </form>

  <div id="result"></div>

  <p class="note">Portfolio demo built on the Home Credit dataset. It must not be used for real credit decisions.</p>
</div>

<script>
const numericIds = ["EXT_SOURCE_1", "EXT_SOURCE_2", "EXT_SOURCE_3",
                    "AMT_INCOME_TOTAL", "AMT_CREDIT", "AMT_GOODS_PRICE", "AMT_ANNUITY"];

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn");
  const box = document.getElementById("result");

  // only send the fields the user filled in; the API fills the rest
  const features = {};
  for (const id of numericIds) {
    const v = document.getElementById(id).value;
    if (v !== "") features[id] = parseFloat(v);
  }
  const age = document.getElementById("age").value;
  if (age !== "") features["DAYS_BIRTH"] = -Math.round(parseFloat(age) * 365.25);

  btn.disabled = true;
  btn.textContent = "Predicting...";
  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ features })
    });
    if (!res.ok) throw new Error("Server returned " + res.status);
    const data = await res.json();
    const pct = (data.default_probability * 100).toFixed(1);
    box.className = data.risk === "high" ? "high" : "low";
    box.innerHTML = '<div class="big">' + pct + '% chance of default</div>' +
                    '<div>Risk level: <strong>' + data.risk + '</strong></div>';
  } catch (err) {
    box.className = "error";
    box.textContent = "Could not get a prediction (" + err.message + "). Is the server running?";
  } finally {
    box.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Predict risk";
  }
});
</script>
</body>
</html>
